name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: panel-web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: panel-web/package-lock.json
      - name: Check repository hygiene
        working-directory: .
        run: |
          node scripts/check-repository.js
          node --test scripts/check-repository.test.js
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check syntax, API document and behavior
        run: npm run check
      - name: Smoke test isolated panel process
        run: npm run test:smoke
      - name: Audit production dependencies
        if: matrix.node == 22
        run: npm audit --omit=dev --audit-level=high
