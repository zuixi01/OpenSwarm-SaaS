services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openswarm
      POSTGRES_USER: openswarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openswarm -d openswarm"]
      interval: 10s
      timeout: 5s
      retries: 10

  panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3999:3999"
    env_file:
      - ./.env
    volumes:
      - ./panel-web/data:/app/panel-web/data
    environment:
      - PANEL_WEB_PORT=3999
      - PANEL_WEB_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL using host postgres in the root .env file}
      - OPENSWARM_REQUIRE_USER_AUTH=1
      - OPENSWARM_AUTH_JWT_SECRET=${OPENSWARM_AUTH_JWT_SECRET:?Set OPENSWARM_AUTH_JWT_SECRET in the root .env file}
      - OPENSWARM_AUTH_REFRESH_SECRET=${OPENSWARM_AUTH_REFRESH_SECRET:?Set OPENSWARM_AUTH_REFRESH_SECRET in the root .env file}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3999/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
