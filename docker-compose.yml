# Yinova 面板 - 仅 Web 面板
# 阴/卦需在宿主机执行 ./install.sh 后通过面板启动，或另行部署
services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
    ports:
      - "3999:3999"
    volumes:
      - ./panel-web/data:/app/panel-web/data
      - ./config.json:/app/config.json
    environment:
      - PANEL_WEB_PORT=3999
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3999/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
