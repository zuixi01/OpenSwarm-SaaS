# Place at /etc/nginx/sites-available/openswarm
# Enable with symlink to /etc/nginx/sites-enabled/openswarm

upstream openswarm_panel {
  server 127.0.0.1:3999;
  keepalive 128;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 2m;

  location / {
    proxy_pass http://openswarm_panel;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep WebSocket/long-poll requests stable.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    send_timeout 60s;
  }

  # Optional dedicated health endpoint for LB
  location = /healthz {
    proxy_pass http://openswarm_panel/api/health;
    access_log off;
  }
}
