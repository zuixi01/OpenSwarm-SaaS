<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenSwarm - AI数字员工平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #05070c;
      --black-light: #0d1322;
      --white: #e9f3ff;
      --white-dim: #8ea5c4;
      --gold: #39d0ff;
      --gold-dim: #16a5d4;
      --text: var(--white);
      --text-dim: var(--white-dim);
      --border: rgba(57, 208, 255, 0.32);
      --glow: rgba(57, 208, 255, 0.45);
      --run-glow: rgba(57, 208, 255, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Space Grotesk", "Noto Sans SC", "PingFang SC", sans-serif;
      background: radial-gradient(circle at 20% 0%, #121d35 0%, #060a14 50%, #02040a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    /* Faulty Terminal 背景层 */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #10233f 0%, #091325 48%, #050a16 100%);
    }
    #starfield canvas {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0.96;
    }
    #starfield::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 54%, rgba(0, 0, 0, 0.42) 100%);
      pointer-events: none;
    }
    .page-content {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 12px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      margin-bottom: 12px;
      width: 100%;
      align-self: stretch;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .header-left { flex-shrink: 0; }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-buttons { display: flex; gap: 8px; align-items: center; }
    .yin-breathe-wrap {
      display: flex;
      align-items: center;
      margin-right: 2px;
    }
    .yin-breathe {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #95a5a6;
    }
    .yin-breathe.online {
      background: #2ecc71;
      animation: yin-breathe-green 2s ease-in-out infinite;
    }
    .yin-breathe.offline {
      background: #e74c3c;
      animation: yin-breathe-red 2s ease-in-out infinite;
    }
    @keyframes yin-breathe-green {
      0%, 100% { opacity: 0.85; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.45); }
      50% { opacity: 1; box-shadow: 0 0 12px 4px rgba(46, 204, 113, 0.35); }
    }
    @keyframes yin-breathe-red {
      0%, 100% { opacity: 0.85; box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.45); }
      50% { opacity: 1; box-shadow: 0 0 12px 4px rgba(231, 76, 60, 0.35); }
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 4px 0;
      color: var(--gold);
      letter-spacing: 0.2em;
    }
    .btn-header-project {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--black-light);
      color: var(--gold);
      font-size: 1.5rem;
      line-height: 1;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .btn-header-project:hover {
      border-color: var(--gold-dim);
      box-shadow: 0 0 12px var(--glow);
    }
    .btn-header-project .btn-header-icon {
      display: block;
      object-fit: contain;
    }
    .btn-header-project.btn-header-text {
      width: auto;
      min-width: auto;
      padding: 0 14px;
      font-size: 0.88rem;
      letter-spacing: 0.04em;
    }
    .yin-offline-banner {
      position: relative;
      width: 100%;
      margin: 10px 0 2px;
      padding: 8px 12px;
      background: rgba(168, 72, 58, 0.15);
      border: 1px solid rgba(193, 100, 82, 0.52);
      border-radius: 6px;
      font-size: 0.82rem;
      color: #e8b8a8;
      text-align: center;
      box-shadow: inset 0 0 16px rgba(105, 39, 30, 0.28);
      backdrop-filter: blur(2px);
      z-index: 2;
    }
    .yin-action-banner {
      position: relative;
      width: 100%;
      margin: 10px 0 2px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(57, 208, 255, 0.26);
      background: rgba(10, 25, 46, 0.72);
      box-shadow: inset 0 0 18px rgba(18, 53, 92, 0.32);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 2;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.24s ease, transform 0.24s ease;
    }
    .yin-action-banner.is-hidden {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }
    .yin-action-banner[data-state="success"] {
      border-color: rgba(109, 242, 186, 0.4);
      background: rgba(8, 42, 38, 0.76);
      box-shadow: inset 0 0 18px rgba(20, 82, 72, 0.28);
    }
    .yin-action-banner[data-state="error"] {
      border-color: rgba(193, 100, 82, 0.52);
      background: rgba(64, 20, 20, 0.42);
      box-shadow: inset 0 0 16px rgba(105, 39, 30, 0.28);
    }
    .yin-action-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .yin-action-title {
      color: #d6f3ff;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .yin-action-desc {
      color: #8fb4d1;
      font-size: 0.76rem;
      line-height: 1.5;
    }
    .yin-action-steps {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .yin-step-chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(57, 208, 255, 0.22);
      background: rgba(255,255,255,0.04);
      color: #7fa8c7;
      font-size: 0.66rem;
      letter-spacing: 0.04em;
      font-family: "JetBrains Mono", monospace;
    }
    .yin-step-chip.active {
      color: #d6f3ff;
      border-color: rgba(57, 208, 255, 0.45);
      box-shadow: 0 0 10px rgba(57, 208, 255, 0.18);
    }
    .yin-step-chip.done {
      color: #8ce4be;
      border-color: rgba(109, 242, 186, 0.35);
    }

    /* 主控策略：静态白线中控环，中间两枚不动圆点为按钮（主控/策略） */
    .row-yinyang {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .taiji-wrap {
      position: relative;
      width: 200px;
      height: 200px;
    }
    .taiji-wrap svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* 主控策略鱼：纯黑 #000000 / 纯白 #FFFFFF，鱼眼反色；外发光 + 呼吸光效 */
    .taiji-wrap {
      filter: drop-shadow(0 0 24px rgba(255,255,255,0.25));
      animation: taiji-glow-breathe 4s ease-in-out infinite;
    }
    @keyframes taiji-glow-breathe {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)) drop-shadow(0 0 50px rgba(255,255,255,0.12)); }
      50% { filter: drop-shadow(0 0 32px rgba(255,255,255,0.35)) drop-shadow(0 0 70px rgba(255,255,255,0.2)); }
    }
    .taiji-wrap svg .half { stroke: none; }
    .taiji-wrap svg .half-white { fill: #FFFFFF; }
    .taiji-wrap svg .half-black { fill: #000000; }
    .taiji-wrap svg .stroke { fill: none; stroke: rgba(255,255,255,0.5); stroke-width: 1; }
    .taiji-wrap svg .eye-white { fill: #FFFFFF; }
    .taiji-wrap svg .eye-black { fill: #000000; }
    /* 两枚圆点按钮：一黑一白。黑按钮所在那一半为白底，白按钮所在那一半为黑底 */
    .taiji-dot {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: box-shadow 0.2s, background 0.2s;
    }
    /* 未点击时透明，悬停略显 */
    .taiji-dot[data-robot="main"] { left: 50%; top: 32%; transform: translate(-50%, -50%); background: rgba(120,120,120,0.3); }
    .taiji-dot[data-robot="yang"] { left: 50%; top: 68%; transform: translate(-50%, -50%); background: #0a0a0e; cursor: default; }
    .taiji-dot[data-robot="main"]:hover { background: rgba(140,140,140,0.45); }
    .taiji-dot[data-robot="yang"]:hover { background: #0a0a0e; }
    .taiji-dot.running { }
    .taiji-dot[data-robot="main"].running {
      background: #f0ece8;
      animation: breathe-dot-white 2s ease-in-out infinite;
    }
    .taiji-dot[data-robot="main"].starting {
      background: #f0ece8;
      animation: breathe-dot-white 1.5s ease-in-out infinite;
    }
    /* 策略：常亮假按钮，仅展示 */
    .taiji-dot[data-robot="yang"] {
      animation: breathe-dot-black 2s ease-in-out infinite;
    }
    @keyframes breathe-dot-white {
      0%, 100% { box-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 16px rgba(255,255,255,0.3); }
      50% { box-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 32px rgba(255,255,255,0.5); }
    }
    @keyframes breathe-dot-black {
      0%, 100% { box-shadow: 0 0 8px rgba(0,0,0,0.8), 0 0 16px rgba(40,40,55,0.5); }
      50% { box-shadow: 0 0 18px rgba(0,0,0,0.95), 0 0 28px rgba(50,50,70,0.6); }
    }

    /* 64数字员工：8 列网格，背景若隐若现呼吸的多智能体 */
    .section-hexagrams {
      width: 100%;
      max-width: min(96vw, 1840px);
      position: relative;
      padding: 8px 0;
    }
    .label-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .section-hexagrams .label {
      font-size: 0.8rem;
      color: var(--gold-dim);
      letter-spacing: 0.2em;
      margin: 0;
      text-align: center;
    }
    .btn-close-all-terminals {
      padding: 6px 14px;
      font-size: 0.75rem;
      color: var(--white);
      background: rgba(80, 80, 80, 0.85);
      border: 1px solid rgba(120, 120, 120, 0.6);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.1em;
      margin-left: 8px;
    }
    .btn-close-all-terminals:hover {
      background: rgba(100, 100, 100, 0.95);
    }
    .btn-close-all-terminals:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .grid-64 {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 20px 16px;
      align-items: start;
    }
    .card-hex {
      position: relative;
      width: 100%;
      padding-top: 10px;
      overflow: visible;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .card-hex:hover {
      transform: translateY(-2px);
      filter: brightness(1.02);
    }
    .card-hex .card-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 5900 / 3928;
      background: url('assets/id-card/holder.png') center / contain no-repeat;
      filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.34));
      --card-inset-x: 5.8%;
      --card-inset-top: 17.4%;
      --card-inset-bottom: 5.7%;
    }
    .card-hex .card-shell::before {
      content: '';
      position: absolute;
      left: var(--card-inset-x);
      right: var(--card-inset-x);
      top: var(--card-inset-top);
      bottom: var(--card-inset-bottom);
      background: #ffffff;
      border-radius: 0;
      opacity: 1;
      pointer-events: none;
      z-index: 0;
    }
    .card-hex .status-dot {
      position: absolute;
      left: 50.1%;
      top: 12.0%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6b6b6b;
      border: 1px solid rgba(0, 0, 0, 0.3);
      transition: background 0.2s;
      z-index: 8;
    }
    .card-hex .status-dot.running {
      background: var(--gold);
      animation: status-dot-breathe 2s ease-in-out infinite;
    }
    @keyframes status-dot-breathe {
      0%, 100% { opacity: 0.85; box-shadow: 0 0 4px var(--gold); }
      50% { opacity: 1; box-shadow: 0 0 10px var(--gold); }
    }
    .card-hex.starting {
      animation: breathe 1.2s ease-in-out infinite;
    }
    .card-hex.running .card-shell {
      filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.36)) drop-shadow(0 0 14px rgba(113, 236, 171, 0.22));
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.94; }
    }
    .card-hex .card-panel {
      position: absolute;
      left: var(--card-inset-x);
      right: var(--card-inset-x);
      top: var(--card-inset-top);
      bottom: var(--card-inset-bottom);
      border-radius: 0;
      overflow: hidden;
      border: none;
      background: transparent;
      z-index: 1;
      perspective: 680px;
    }
    .card-hex .card-flip-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }
    .card-hex.card-flipped .card-flip-inner {
      transform: rotateY(180deg);
    }
    .card-hex .card-face {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 34px 1fr;
      border-radius: 0;
      overflow: hidden;
      backface-visibility: hidden;
    }
    .card-hex .card-face-front {
      z-index: 2;
    }
    .card-hex .card-face-back {
      transform: rotateY(180deg);
      z-index: 1;
    }
    .card-hex .card-main-blank {
      background: #ffffff;
      min-height: 0;
    }
    .card-hex .card-side,
    .card-hex .card-main {
      position: relative;
      z-index: 1;
    }
    .card-hex .card-side {
      background: #efe622;
      color: rgba(97, 97, 24, 0.52);
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 0.54rem;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card-hex .card-main {
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: #252b33;
      position: relative;
      padding-bottom: 48px;
      min-height: 0;
    }
    .card-hex .card-top {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
      padding-left: 0;
      margin-bottom: 2px;
    }
    .card-hex .card-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
    }
    .card-hex .card-avatar-label {
      min-height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .card-hex .card-avatar-label .card-label-inline {
      justify-content: center;
    }
    .card-hex .card-title {
      font-family: "JetBrains Mono", "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin: 2px 0 0;
      color: #2f3238;
      line-height: 1.15;
      text-transform: uppercase;
    }
    html[lang="en"] .card-hex .card-title {
      font-family: "Space Grotesk", "Noto Sans SC", "PingFang SC", sans-serif;
    }
    .card-hex .card-avatar-wrap {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid #e8dc27;
      padding: 6px;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-hex .card-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: none;
      background: #c2c7cf;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-hex .card-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: 50%;
    }
    .card-hex .card-right {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 0;
    }
    .card-hex .card-barcode {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      color: #2e2f33;
      line-height: 1;
      margin-bottom: 3px;
      user-select: none;
    }
    .card-hex .card-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .card-hex .card-info-k {
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #1f2227;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .card-hex .card-info-v {
      font-size: 0.5rem;
      color: #5a616a;
      line-height: 1.3;
      word-break: break-word;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    }
    .card-hex .card-label-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card-hex .card-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #2f3238;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .card-hex .card-label.empty {
      color: #6b7280;
      font-weight: 500;
    }
    .card-hex .card-label:hover {
      color: #1d2126;
    }
    .card-hex .card-label-input {
      width: 100%;
      min-width: 60px;
      max-width: 120px;
      padding: 2px 6px;
      margin: -2px 0;
      font-size: 0.72rem;
      font-weight: 600;
      color: #2f3238;
      letter-spacing: 0.02em;
      font-family: inherit;
      border: 1px solid #c9a227;
      border-radius: 4px;
      background: #fffef5;
      outline: none;
      box-sizing: border-box;
    }
    .card-hex .card-role {
      margin: -1px 0 0;
      width: 100%;
      text-align: left;
      font-size: 0.5rem;
      font-weight: 700;
      color: #7e858d;
      line-height: 1.2;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .card-hex .card-motto {
      margin: 2px 0 0;
      width: 100%;
      border-top: 1px dashed rgba(120, 124, 131, 0.35);
      padding-top: 7px;
      color: #6f747b;
      font-size: 0.49rem;
      line-height: 1.35;
      text-align: left;
      min-height: 0;
    }
    .card-hex .card-gateway {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.49rem;
      letter-spacing: 0.01em;
      text-transform: none;
    }
    .card-hex .card-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: nowrap;
      margin-top: 0;
      position: absolute;
      right: 14px;
      bottom: 10px;
      align-self: auto;
    }
    .card-hex .btn-start,
    .card-hex .btn-stop {
      min-width: 58px;
      padding: 4px 8px;
      font-size: 0.56rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.08em;
      font-family: inherit;
      transition: filter 0.2s, transform 0.2s;
    }
    .card-hex .btn-start {
      border: 1px solid #222830;
      background: #f0e51e;
      color: #222830;
    }
    .card-hex .btn-start:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .card-hex .btn-stop {
      display: none;
      border: 1px solid #5a2020;
      background: #f08a8a;
      color: #3e1010;
    }

    .toast {

    /* AI数字游民主题覆盖 */

        radial-gradient(circle at 85% 15%, rgba(57, 208, 255, 0.2), transparent 35%),

    .taiji-wrap.control-bridge::after {

  <script src="i18n.js"></script>
  <script src="/assets/dot-grid-bg.js"></script>
  <script>
    // 未配置 API Key 时跳转到配置页（本地模型如 Ollama/vLLM 无需 Key，不跳转）
    (function checkConfig() {
      var noKeyProviders = ['ollama', 'vllm'];
      fetch('/api/config').then(function(r) { return r.json(); }).then(function(c) {
        if (!c) return;
        var provider = (c.provider || '').toLowerCase();
        if (noKeyProviders.indexOf(provider) >= 0) return;
        if (!c.apiKey || (typeof c.apiKey === 'string' && !c.apiKey.trim())) {
          if (!/config\.html/.test(window.location.pathname + window.location.search)) {
            window.location.replace('config.html');
          }
        }
      }).catch(function() {});
    })();

    if (window.initDotGridBackground) {
      window.initDotGridBackground({
        containerId: 'starfield',
        dotSize: 1.8,
        gap: 24,
        baseColor: '85,125,168',
        activeColor: '64,211,255',
        bgColor: '5,10,22',
        pulse: 0.26,
        mouseRadius: 180,
        mouseStrength: 1
      });
    }

    const toast = document.getElementById('toast');
    const rowYinyang = document.getElementById('rowYinyang');
    const grid64 = document.getElementById('grid64');

    var t = window.OPENSWARM_I18N && window.OPENSWARM_I18N.t ? window.OPENSWARM_I18N.t.bind(window.OPENSWARM_I18N) : function(k) { return k; };
    var getHexDisplayName = window.OPENSWARM_I18N && window.OPENSWARM_I18N.getHexDisplayName ? function(id, name) { return window.OPENSWARM_I18N.getHexDisplayName(id, name); } : function(id, name) { return name || id; };
    var toastTimer = null;
    function esc(s) { if (s == null) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function show(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        toast.classList.remove('show');
        toastTimer = null;
      }, 3200);
    }

    function displayName(robot) {
      if (robot.id === 'main') return '主控';
      return robot.name;
    }
    var FIXED_BADGE_AVATAR_POOL = (function() {
      var list = [];
      for (var i = 1; i <= 9; i++) list.push('assets/avatar/avatar-' + String(i).padStart(2, '0') + '.svg');
      ['female', 'professor', 'researcher'].forEach(function(kind) {
        for (var j = 1; j <= 3; j++) list.push('assets/avatar/' + kind + '-' + String(j).padStart(2, '0') + '.svg');
      });
      for (var k = 19; k <= 64; k++) list.push('assets/avatar/employee-' + String(k).padStart(2, '0') + '.svg');
      return list;
    })();
    function hashTextToIndex(text, mod) {
      var h = 0;
      var s = String(text || '');
      for (var i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
      return Math.abs(h) % mod;
    }
    function resolveBadgeAvatarIndex(robot) {
      var p = Number(robot && robot.port);
      if (Number.isFinite(p) && p >= 18791 && p <= 18854) return p - 18791;
      var id = String(robot && robot.id || '');
      var fixedTop = ['qian', 'kun', 'tai', 'pi', 'xun', 'yu', 'sui', 'gu', 'lin', 'guan'];
      var topIdx = fixedTop.indexOf(id);
      if (topIdx >= 0) return topIdx;
      var m = id.match(/^h(\d{2})$/i);
      if (m) {
        var num = parseInt(m[1], 10);
        if (num >= 11 && num <= 64) return num - 1;
      }
      return hashTextToIndex(id, FIXED_BADGE_AVATAR_POOL.length);
    }
    function resolveBadgeAvatarSrc(robot) {
      return FIXED_BADGE_AVATAR_POOL[resolveBadgeAvatarIndex(robot)];
    }

    let currentRuntimeOverview = null;
    let currentRuntimeAgents = [];
    let currentRuntimeAlerts = null;
    let runtimeActionState = null;
    let runtimeActionTimer = null;
    let runtimeActionFadeTimer = null;

    function runtimeAgentMap() {
      const byId = {};
      (currentRuntimeAgents || []).forEach(function(agent) {
        if (agent && agent.agentId) byId[agent.agentId] = agent;
      });
      return byId;
    }

    async function fetchTenantRuntimeOverview() {
      try {
        const r = await fetch('/api/tenant-runtime/overview');
        if (!r.ok) return null;
        return await r.json();
      } catch (_) {
        return null;
      }
    }

    async function fetchTenantRuntimeAgents() {
      try {
        const r = await fetch('/api/tenant-runtime/runtime/agents');
        if (!r.ok) return [];
        const data = await r.json();
        return Array.isArray(data && data.items) ? data.items : [];
      } catch (_) {
        return [];
      }
    }

    async function fetchTenantRuntimeAlerts() {
      try {
        if (!window.__openswarmSession || !window.__openswarmSession.tenant || !window.__openswarmSession.tenant.id) return null;
        const r = await fetch('/api/runtime-admin/alerts?tenantId=' + encodeURIComponent(window.__openswarmSession.tenant.id));
        if (!r.ok) return null;
        return await r.json();
      } catch (_) {
        return null;
      }
    }

    function renderRuntimeAlertChip() {
      const el = document.getElementById('tenantRuntimeAlertChip');
      if (!el) return;
      const summary = currentRuntimeAlerts && currentRuntimeAlerts.summary ? currentRuntimeAlerts.summary : null;
      if (!summary) {
        el.style.display = 'none';
        return;
      }
      el.style.display = '';
      if (!summary.total) {
        el.textContent = '运行正常';
        el.style.color = '#8ea5c4';
        el.style.borderColor = 'rgba(57,208,255,0.28)';
      } else if (summary.critical > 0) {
        el.textContent = 'Critical ' + summary.critical + ' · Warn ' + (summary.warn || 0);
        el.style.color = '#ff6b7f';
        el.style.borderColor = 'rgba(255,107,127,0.38)';
      } else {
        el.textContent = 'Warn ' + (summary.warn || 0);
        el.style.color = '#ffce56';
        el.style.borderColor = 'rgba(255,206,86,0.38)';
      }
    }

    async function startTenantMain() {
      const r = await fetch('/api/tenant-runtime/runtime/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: 'main' })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.error) throw new Error(data.error || ('HTTP ' + r.status));
      return data;
    }

    async function stopTenantMain() {
      const r = await fetch('/api/tenant-runtime/runtime/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: 'main' })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.error) throw new Error(data.error || ('HTTP ' + r.status));
      return data;
    }

    function formatElapsedMs(ms) {
      var seconds = Math.max(0, Math.round(Number(ms || 0) / 100) / 10);
      return seconds.toFixed(seconds >= 10 ? 0 : 1) + ' 秒';
    }

    function clearRuntimeActionTimers() {
      if (runtimeActionTimer) {
        clearInterval(runtimeActionTimer);
        runtimeActionTimer = null;
      }
      if (runtimeActionFadeTimer) {
        clearTimeout(runtimeActionFadeTimer);
        runtimeActionFadeTimer = null;
      }
    }

    function renderRuntimeActionSteps(currentIndex, doneCount) {
      const stepsEl = document.getElementById('yinActionSteps');
      if (!stepsEl) return;
      const labels = ['请求已发送', '网关拉起中', '状态确认中'];
      stepsEl.innerHTML = labels.map(function(label, index) {
        var cls = 'yin-step-chip';
        if (index < doneCount) cls += ' done';
        else if (index === currentIndex) cls += ' active';
        return '<span class="' + cls + '">' + label + '</span>';
      }).join('');
    }

    function setRuntimeActionState(payload) {
      const banner = document.getElementById('yinActionBanner');
      const titleEl = document.getElementById('yinActionTitle');
      const descEl = document.getElementById('yinActionDesc');
      if (!banner || !titleEl || !descEl) return;
      clearRuntimeActionTimers();
      if (!payload) {
        runtimeActionState = null;
        banner.classList.add('is-hidden');
        banner.removeAttribute('data-state');
        runtimeActionFadeTimer = setTimeout(function() {
          if (!runtimeActionState) banner.style.display = 'none';
        }, 240);
        return;
      }
      runtimeActionState = {
        state: payload.state || 'pending',
        title: payload.title || '',
        desc: payload.desc || '',
        currentStep: Number.isFinite(payload.currentStep) ? payload.currentStep : 0,
        doneCount: Number.isFinite(payload.doneCount) ? payload.doneCount : 0,
        startedAt: Number(payload.startedAt || Date.now()),
        autoHideMs: Number(payload.autoHideMs || 0),
      };
      banner.style.display = '';
      requestAnimationFrame(function() {
        banner.classList.remove('is-hidden');
      });
      function applyRuntimeActionState() {
        if (!runtimeActionState) return;
        banner.setAttribute('data-state', runtimeActionState.state);
        titleEl.textContent = runtimeActionState.title;
        descEl.textContent = runtimeActionState.desc + ' · 已耗时 ' + formatElapsedMs(Date.now() - runtimeActionState.startedAt);
        renderRuntimeActionSteps(runtimeActionState.currentStep, runtimeActionState.doneCount);
      }
      applyRuntimeActionState();
      if (runtimeActionState.state === 'pending') {
        runtimeActionTimer = setInterval(applyRuntimeActionState, 200);
      } else if (runtimeActionState.autoHideMs > 0) {
        runtimeActionFadeTimer = setTimeout(function() {
          setRuntimeActionState(null);
        }, runtimeActionState.autoHideMs);
      }
    }

    async function waitForMainRuntime(targetRunning, options) {
      const timeoutMs = options && options.timeoutMs ? options.timeoutMs : 15000;
      const stepTitle = options && options.stepTitle ? options.stepTitle : (targetRunning ? '正在确认主控状态…' : '正在确认主控已停止…');
      const successTitle = options && options.successTitle ? options.successTitle : (targetRunning ? '主控已启动' : '主控已停止');
      const successDesc = options && options.successDesc ? options.successDesc : (targetRunning ? '现在可以进入团队与项目空间了。' : '主控已完成关闭。');
      const startedAt = options && options.startedAt ? options.startedAt : Date.now();
      let attempt = 0;
      while (Date.now() - startedAt < timeoutMs) {
        attempt += 1;
        setRuntimeActionState({
          state: 'pending',
          title: stepTitle,
          desc: '第 ' + attempt + ' 次状态确认中，请稍候…',
          currentStep: 2,
          doneCount: 2,
          startedAt,
        });
        try {
          currentRuntimeOverview = await fetchTenantRuntimeOverview();
          currentRuntimeAlerts = await fetchTenantRuntimeAlerts();
          renderRuntimeAlertChip();
        } catch (_) {}
        const mainRunning = !!(currentRuntimeOverview && currentRuntimeOverview.runtime && currentRuntimeOverview.runtime.mainRunning);
        applyYinGatewayStatus(mainRunning);
        if (mainRunning === targetRunning) {
          setRuntimeActionState({
            state: 'success',
            title: successTitle,
            desc: successDesc,
            currentStep: 2,
            doneCount: 3,
            startedAt,
            autoHideMs: 2200,
          });
          return true;
        }
        await new Promise(function(resolve) { setTimeout(resolve, targetRunning ? 700 : 500); });
      }
      setRuntimeActionState({
        state: 'error',
        title: targetRunning ? '主控启动超时' : '主控停止超时',
        desc: '后端已收到请求，但状态确认超时。可以稍候刷新再看，或再次操作。',
        currentStep: 2,
        doneCount: 2,
        startedAt,
      });
      return false;
    }

    async function waitForWorkerRuntime(robotId, targetRunning, options) {
      const timeoutMs = options && options.timeoutMs ? options.timeoutMs : 15000;
      const display = options && options.displayName ? options.displayName : displayName({ id: robotId, name: robotId });
      const successTitle = options && options.successTitle ? options.successTitle : (targetRunning ? (display + ' 已启动') : (display + ' 已停止'));
      const successDesc = options && options.successDesc ? options.successDesc : (targetRunning ? '员工网关已就绪，可以立即接任务。' : '员工已完成关闭。');
      const startedAt = options && options.startedAt ? options.startedAt : Date.now();
      let attempt = 0;
      while (Date.now() - startedAt < timeoutMs) {
        attempt += 1;
        setRuntimeActionState({
          state: 'pending',
          title: targetRunning ? ('正在启动 ' + display + '…') : ('正在停止 ' + display + '…'),
          desc: '第 ' + attempt + ' 次状态确认中，请稍候…',
          currentStep: 2,
          doneCount: 2,
          startedAt,
        });
        try {
          currentRuntimeOverview = await fetchTenantRuntimeOverview();
          currentRuntimeAgents = await fetchTenantRuntimeAgents();
          currentRuntimeAlerts = await fetchTenantRuntimeAlerts();
          renderRuntimeAlertChip();
        } catch (_) {}
        const agent = (currentRuntimeAgents || []).find(function(item) { return item && item.agentId === robotId; });
        if (!!(agent && agent.running) === targetRunning) {
          setRuntimeActionState({
            state: 'success',
            title: successTitle,
            desc: successDesc,
            currentStep: 2,
            doneCount: 3,
            startedAt,
            autoHideMs: 2200,
          });
          return true;
        }
        await new Promise(function(resolve) { setTimeout(resolve, targetRunning ? 650 : 450); });
      }
      setRuntimeActionState({
        state: 'error',
        title: (targetRunning ? '启动' : '停止') + display + ' 超时',
        desc: '请求已发送，但员工状态确认超时。可以稍候刷新再看，或再次操作。',
        currentStep: 2,
        doneCount: 2,
        startedAt,
      });
      return false;
    }

    async function startTenantWorker(robotId) {
      const r = await fetch('/api/tenant-runtime/runtime/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agentId: robotId })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.error) throw new Error(data.error || ('HTTP ' + r.status));
      return data;
    }

    async function stopTenantWorker(robotId) {
      const r = await fetch('/api/tenant-runtime/runtime/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agentId: robotId })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.error) throw new Error(data.error || ('HTTP ' + r.status));
      return data;
    }

    function updateCardsRunning(robots) {
      const byId = {};
      const runtimeById = runtimeAgentMap();
      robots.forEach(r => { byId[r.id] = r; });
      const hexRunning = Object.values(runtimeById).filter(r => r && r.running).length;
      const labelEl = document.getElementById('hexLabel');
      if (labelEl) labelEl.textContent = t('hexLabelWithCount', hexRunning);
      rowYinyang.querySelectorAll('.taiji-dot').forEach(btn => {
        const rid = btn.dataset.robot;
        if (rid === 'yang') {
          btn.title = t('yangDisplayOnly');
          return;
        }
        const runtimeAgent = runtimeById[rid];
        const r = byId[rid];
        const isRunning = rid === 'main'
          ? !!(currentRuntimeOverview && currentRuntimeOverview.runtime && currentRuntimeOverview.runtime.mainRunning)
          : (runtimeAgent ? !!runtimeAgent.running : (!!r && !!r.running));
        btn.classList.toggle('running', isRunning);
        if (isRunning) {
          btn.classList.remove('starting');
          btn.title = rid === 'main' ? t('yinClickMainStop') : t('yinClickStop');
        } else {
          btn.title = rid === 'main' ? t('yinClickMainStart') : t('yinClickStart');
        }
      });
      grid64.querySelectorAll('.card-hex').forEach(card => {
        var robotId = card.dataset.robot;
        if (!robotId) return;
        var r = byId[robotId];
        var runtimeAgent = runtimeById[robotId];
        var running = runtimeAgent ? !!runtimeAgent.running : !!(r && r.running);
        card.classList.toggle('running', running);
        if (running) card.classList.remove('starting');
        var dot = card.querySelector('.status-dot');
        if (dot) {
          dot.classList.toggle('running', running);
          dot.setAttribute('aria-label', running ? t('statusRunning') : t('statusStopped'));
        }
        var statusText = card.querySelector('.card-status-text');
        if (statusText) statusText.textContent = running ? t('statusRunning') : t('statusStopped');
        var gwText = card.querySelector('.card-gateway');
        if (gwText) {
          if (runtimeAgent && runtimeAgent.port) gwText.textContent = '127.0.0.1:' + String(runtimeAgent.port);
          else if (r && r.gateway) gwText.textContent = String(r.gateway).replace('ws://', '');
        }
        var startBtn = card.querySelector('.btn-start');
        var stopBtn = card.querySelector('.btn-stop');
        if (startBtn) startBtn.style.display = running ? 'none' : 'inline-block';
        if (stopBtn) stopBtn.style.display = running ? 'inline-block' : 'none';
      });
    }

    function bindStart(targetEl, btn, robotId) {
      if (!btn) return;
      btn.addEventListener('click', async () => {
        (targetEl || btn).classList.add('starting');
        try {
          await startTenantWorker(robotId);
          currentRuntimeOverview = await fetchTenantRuntimeOverview();
          currentRuntimeAgents = await fetchTenantRuntimeAgents();
          currentRuntimeAlerts = await fetchTenantRuntimeAlerts();
          renderRuntimeAlertChip();
          show(t('toastTerminalOpened'));
        } catch (e) {
          show(t('toastRequestFailed') + ': ' + (e.message || ''));
          (targetEl || btn).classList.remove('starting');
        }
      });
    }
    function bindStop(targetEl, btn, robotId) {
      if (!btn) return;
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await stopTenantWorker(robotId);
          currentRuntimeOverview = await fetchTenantRuntimeOverview();
          currentRuntimeAgents = await fetchTenantRuntimeAgents();
          currentRuntimeAlerts = await fetchTenantRuntimeAlerts();
          renderRuntimeAlertChip();
          show(t('toastStopped'));
          var next = await fetchRobots();
          updateCardsRunning(next);
        } catch (e) {
          show(t('toastRequestFailed') + ': ' + (e.message || ''));
        }
        btn.disabled = false;
      });
    }

    async function fetchRobots(nocache) {
      try {
        const url = nocache ? '/api/robots?nocache=1' : '/api/robots';
        const r = await fetch(url);
        if (r.ok) return await r.json();
      } catch (_) {}
      return [
        { id: 'main', name: '主', gateway: 'ws://127.0.0.1:18789', running: false },
      ];
    }

    async function requireMainGatewayReady(nextUrl, sourceLabel) {
      var mainRunning = false;
      for (var attempt = 0; attempt < 5; attempt++) {
        try {
          currentRuntimeOverview = await fetchTenantRuntimeOverview();
          currentRuntimeAlerts = await fetchTenantRuntimeAlerts();
          renderRuntimeAlertChip();
        } catch (_) {}
        mainRunning = !!(currentRuntimeOverview && currentRuntimeOverview.runtime && currentRuntimeOverview.runtime.mainRunning);
        if (mainRunning) break;
        if (attempt === 0) {
          show('正在确认主控状态，请稍候…');
        }
        await new Promise(function(resolve) { setTimeout(resolve, 800); });
      }
      applyYinGatewayStatus(mainRunning);
      if (!mainRunning) {
        show((sourceLabel || '当前操作') + '需要先启动主控。请先点击上方「COMMAND CORE」启动主控。');
        return false;
      }
      if (nextUrl) location.href = nextUrl;
      return true;
    }

          } else {

            var actionStartedAt = Date.now();
            try {
              if (robotId === 'main') {

                  state: 'pending',
                  title: '正在启动主控…',

                });
                await startTenantMain();
                setRuntimeActionState({

                await waitForMainRuntime(true, {

                await waitForWorkerRuntime(robotId, true, {
                  displayName: displayName(robot || { id: robotId, name: robotId }),
                  successDesc: '员工网关已就绪，可以继续派发任务。',

                });
              }
              currentRuntimeOverview = await fetchTenantRuntimeOverview();
              currentRuntimeAgents = await fetchTenantRuntimeAgents();
              currentRuntimeAlerts = await fetchTenantRuntimeAlerts();
              renderRuntimeAlertChip();
              updateCardsRunning(await fetchRobots());
              if (robotId !== 'main') show(t('toastTerminalOpened'));
              if (robotId === 'main' && typeof checkYinGatewayStatus === 'function') {
                setTimeout(checkYinGatewayStatus, 800);
                setTimeout(checkYinGatewayStatus, 2000);
                setTimeout(checkYinGatewayStatus, 3500);
              }
            } catch (e) {
              show(t('toastRequestFailed') + ': ' + (e.message || ''));
              if (robotId === 'main') {
                setRuntimeActionState({
                  state: 'error',
                  title: '启动主控失败',
                  desc: e.message || '启动请求未完成，请稍后重试。',
                  currentStep: 0,
                  doneCount: 0,
                  startedAt: actionStartedAt,
                });
              } else {
                setRuntimeActionState({
                  state: 'error',
                  title: '启动 ' + displayName(robot || { id: robotId, name: robotId }) + ' 失败',
                  desc: e.message || '启动请求未完成，请稍后重试。',

                  doneCount: 0,
                  startedAt: actionStartedAt,
                });

              btn.classList.remove('starting');
            }
          }
        });
      });

      grid64.innerHTML = hexagrams.map(robot => {
        var label = robot.label ? String(robot.label).trim() : '';
        var cleanLabel = label.replace(/\s*(NO\.\d{2}|DG-\d{2})\s*$/i, '').trim();
        var labelRow = cleanLabel
          ? '<span class="card-label" data-robot="' + esc(robot.id) + '" title="' + esc(cleanLabel) + '">' + esc(cleanLabel) + '</span>'
          : '';
        var displayName = getHexDisplayName(robot.id, robot.name);
        var cleanDisplayName = String(displayName || '').replace(/\s*(NO\.\d{2}|DG-\d{2})\s*$/i, '').trim() || displayName;
        var roleText = cleanLabel || robot.name || cleanDisplayName || displayName || (window.OPENSWARM_I18N && window.OPENSWARM_I18N.t('badgeRoleFallback')) || '数字员工';
        var mottoText = (window.OPENSWARM_I18N && window.OPENSWARM_I18N.t('badgeMotto')) || '先澄清目标，再执行动作。';
        var statusText = robot.running ? t('statusRunning') : t('statusStopped');
        var avatarSrc = resolveBadgeAvatarSrc(robot);
        return `
        <div class="card-hex" data-robot="${robot.id}" data-port="${robot.port != null ? robot.port : ''}">
          <span class="status-dot${robot.running ? ' running' : ''}" aria-label="${robot.running ? t('statusRunning') : t('statusStopped')}"></span>
          <div class="card-shell">
            <div class="card-panel">
              <div class="card-flip-inner">
                <div class="card-face card-face-front">
                  <div class="card-side">DIGITAL EMPLOYEE</div>
                  <div class="card-main">

                          </div>
                        </div>
                        <div class="card-avatar-label">
                          ${labelRow ? '<span class="card-label-inline">' + labelRow + '</span>' : ''}

                      </div>
                      <div class="card-right">

                        </div>
                        <div class="card-info">

                        </div>

                      <button type="button" class="btn-start" data-action="start">${t('btnStart')}</button>
                      <button type="button" class="btn-stop" data-action="stop">${t('btnStop')}</button>
                    </div>
                  </div>
                </div>
                <div class="card-face card-face-back">
                  <div class="card-side">DIGITAL EMPLOYEE</div>
                  <div class="card-main card-main-blank"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      }).join('');
      // 事件委托：点哪张卡用哪张卡的 robot/port，避免谦/蛊错位、坤/泰点不动
      grid64.addEventListener('click', async function(e) {
        var labelEl = e.target.closest('.card-label');
        if (labelEl && !labelEl.querySelector('.card-label-input')) {
          e.preventDefault();
          e.stopPropagation();
          var editRobotId = labelEl.dataset.robot;
          var robotForLabel = (await fetchRobots()).find(function(r) { return r.id === editRobotId; });
          var current = (robotForLabel && robotForLabel.label) ? String(robotForLabel.label).trim() : '';
          var inline = labelEl.closest('.card-label-inline');
          if (!inline) return;
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'card-label-input';
          input.value = current;
          input.setAttribute('maxlength', '32');
          input.setAttribute('placeholder', (window.OPENSWARM_I18N && window.OPENSWARM_I18N.t('hexLabel')) || '标签');
          labelEl.style.display = 'none';
          inline.appendChild(input);
          input.focus();
          input.select();
          function commit() {
            var newLabel = (input.value || '').trim();
            input.remove();
            labelEl.style.display = '';
            if (newLabel === current) return;
            fetch('/api/agent/' + encodeURIComponent(editRobotId) + '/label', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ label: newLabel }) })
              .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }).catch(function() { return { ok: r.ok, data: {} }; }); })
              .then(function(result) {
                if (result.ok && !(result.data && result.data.error)) {
                  show(window.OPENSWARM_I18N && window.OPENSWARM_I18N.t('hexLabelSaved') || '标签已保存');
                  labelEl.textContent = newLabel || ((window.OPENSWARM_I18N && window.OPENSWARM_I18N.t('hexLabel')) || '标签');
                  labelEl.classList.toggle('empty', !newLabel);
                  labelEl.title = newLabel ? newLabel : ((window.OPENSWARM_I18N && window.OPENSWARM_I18N.t('hexLabelSet')) || '设置标签');
                } else show((result.data && result.data.error) || '保存失败');
              })
              .catch(function(err) { show(err && err.message || '请求失败'); });
          }
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
            if (ev.key === 'Escape') { input.value = current; input.blur(); }
          });
          return;
        }
        const card = e.target.closest('.card-hex');
        if (!card) return;
        if ((e.target.closest('.card-face-front') || e.target.closest('.card-face-back')) && !e.target.closest('.card-actions') && !e.target.closest('.card-label')) {
          card.classList.toggle('card-flipped');
          return;
        }
        const robotId = card.dataset.robot;
        const port = card.dataset.port;
        const startBtn = e.target.closest('.btn-start');
        const stopBtn = e.target.closest('.btn-stop');
        if (startBtn) {
          card.classList.add('starting');
          var actionStartedAt = Date.now();
          try {
            var startDisplayName = displayName({ id: robotId, name: card.querySelector('.card-no') ? card.querySelector('.card-no').textContent : robotId });
            setRuntimeActionState({
              state: 'pending',
              title: '正在启动 ' + startDisplayName + '…',
              desc: '正在发送启动请求并等待员工网关就绪。',
              currentStep: 0,
              doneCount: 0,
              startedAt: actionStartedAt,
            });
            await startTenantWorker(robotId);
            await waitForWorkerRuntime(robotId, true, {
              displayName: startDisplayName,
              successDesc: '员工网关已就绪，可以继续派发任务。',
              startedAt: actionStartedAt,

            updateCardsRunning(await fetchRobots());
          } catch (err) {
            show(t('toastRequestFailed') + ': ' + (err.message || ''));
            setRuntimeActionState({
              state: 'error',
              title: '启动 ' + startDisplayName + ' 失败',
              desc: err.message || '启动请求未完成，请稍后重试。',
              currentStep: 0,
              doneCount: 0,
              startedAt: actionStartedAt,
            });
            card.classList.remove('starting');
          }
        } else if (stopBtn) {
          stopBtn.disabled = true;
          var actionStartedAt = Date.now();
          try {
            var stopDisplayName = displayName({ id: robotId, name: card.querySelector('.card-no') ? card.querySelector('.card-no').textContent : robotId });
            setRuntimeActionState({
              state: 'pending',
              title: '正在停止 ' + stopDisplayName + '…',
              desc: '正在发送停止请求并等待员工退出。',
              currentStep: 0,
              doneCount: 0,
              startedAt: actionStartedAt,
            });
            await stopTenantWorker(robotId);
            await waitForWorkerRuntime(robotId, false, {
              displayName: stopDisplayName,
              successDesc: '员工已完成停止。',
              startedAt: actionStartedAt,
            });
            var next = await fetchRobots();
            updateCardsRunning(next);
          } catch (err) {
            show(t('toastRequestFailed') + ': ' + (err.message || ''));
            setRuntimeActionState({
              state: 'error',
              title: '停止 ' + stopDisplayName + ' 失败',
              desc: err.message || '停止请求未完成，请稍后重试。',
              currentStep: 0,
              doneCount: 0,
              startedAt: actionStartedAt,
            });
          }
          stopBtn.disabled = false;
        }
      });

      updateCardsRunning(robots);
      // 智能轮询：有员工处于过渡状态（starting）时 1s，否则 5s
      let _pollTimer = null;
      function schedulePoll() {
        var hasStarting = !!document.querySelector('.card-hex.starting, .taiji-dot.starting');
        var interval = hasStarting ? 1000 : 5000;
        _pollTimer = setTimeout(async function() {
          const next = await fetchRobots();
          currentRuntimeOverview = await fetchTenantRuntimeOverview();
          currentRuntimeAgents = await fetchTenantRuntimeAgents();
          currentRuntimeAlerts = await fetchTenantRuntimeAlerts();
          renderRuntimeAlertChip();
          updateCardsRunning(next);
          schedulePoll();
        }, interval);
      }
      schedulePoll();
    }

    // 「一键启动前10员工」按钮已移除，接口仍保留以兼容脚本调用

    const btnCloseAllTerminals = document.getElementById('btnCloseAllTerminals');
    if (btnCloseAllTerminals) {
      btnCloseAllTerminals.addEventListener('click', async () => {
        btnCloseAllTerminals.disabled = true;
        try {
          const r = await fetch('/api/close-all-agent-terminals', { method: 'POST' });
          const data = await r.json().catch(() => ({}));
          if (r.ok && data.ok) {
            const n = (data.closed != null ? data.closed : 0);
            show(n > 0 ? t('toastClosedAll') : t('toastNoTerminals'));
            // 立即刷新（nocache），然后每500ms刷新一次，持续6次（共3秒）
            var next = await fetchRobots(true);
            updateCardsRunning(next);
            var refreshCount = 0;
            var refreshInterval = setInterval(async () => {
              refreshCount++;
              next = await fetchRobots(true);
              updateCardsRunning(next);
              if (refreshCount >= 6) {
                clearInterval(refreshInterval);
                show(t('toastStatusUpdated'));
              }
            }, 500);
          } else {
            show(data.error || t('toastCloseFailed'));
          }
        } catch (e) {
          show(t('toastRequestFailed') + ': ' + (e.message || ''));
        }
        btnCloseAllTerminals.disabled = false;
      });
    }

    render();

    window.OPENSWARM_APPLY_I18N_EXTRAS = function() {
      fetchRobots().then(function(r) {
        updateCardsRunning(r);
        var grid = document.getElementById('grid64');
        if (grid && window.OPENSWARM_I18N) {
          var byId = {};
          r.forEach(function(robot) { byId[robot.id] = robot; });
          grid.querySelectorAll('.card-hex').forEach(function(card) {
            var rid = card.dataset.robot;
            var robot = byId[rid];
            var title = card.querySelector('.card-title');
            if (title && robot) title.textContent = getHexDisplayName(robot.id, robot.name);
          });
          grid.querySelectorAll('.btn-start').forEach(function(b) { b.textContent = window.OPENSWARM_I18N.t('btnStart'); });
          grid.querySelectorAll('.btn-stop').forEach(function(b) { b.textContent = window.OPENSWARM_I18N.t('btnStop'); });
        }
      });
    };

    // 主控心跳：轻量状态轮询（每 2 秒），更新呼吸灯与未启动提示条
    var yinOfflineBanner = document.getElementById('yinOfflineBanner');
    var yinBreatheLight = document.getElementById('yinBreatheLight');
    var yinBreatheWrap = document.getElementById('yinBreatheWrap');
    function updateYinBreathe(ok) {
      if (!yinBreatheLight) return;
      yinBreatheLight.classList.remove('online', 'offline');
      yinBreatheLight.classList.add(ok ? 'online' : 'offline');
      if (yinBreatheWrap) yinBreatheWrap.title = ok ? '主控已连接' : '主控未连接';
    }
    function applyYinGatewayStatus(ok) {
      if (yinOfflineBanner) yinOfflineBanner.style.display = ok ? 'none' : 'block';
      updateYinBreathe(ok);
    }
    function checkYinGatewayStatus() {
      fetchTenantRuntimeOverview()
        .then(function(overview) {
          currentRuntimeOverview = overview || null;
          return fetchTenantRuntimeAlerts().then(function(alerts) {
            currentRuntimeAlerts = alerts;
            renderRuntimeAlertChip();
            return overview;
          }).catch(function() {
            renderRuntimeAlertChip();
            return overview;
          });
        })
        .then(function(overview) {
          var ok = !!(overview && overview.runtime && overview.runtime.mainRunning);
          applyYinGatewayStatus(ok);
        })
        .catch(function() {
          fetch('/api/robots')
            .then(function(r) {
              if (!r.ok) throw new Error('robots http ' + r.status);
              return r.json();
            })
            .then(function(list) {
              var arr = Array.isArray(list) ? list : [];
              var main = arr.find(function(item) { return item && item.id === 'main'; });
              renderRuntimeAlertChip();
              applyYinGatewayStatus(!!(main && main.running));
            })
            .catch(function() {
              renderRuntimeAlertChip();
              applyYinGatewayStatus(false);
            });
        });
    }
    window.addEventListener('openswarm-auth-session', async function() {
      currentRuntimeOverview = await fetchTenantRuntimeOverview();
      currentRuntimeAgents = await fetchTenantRuntimeAgents();
      currentRuntimeAlerts = await fetchTenantRuntimeAlerts();
      renderRuntimeAlertChip();
      updateCardsRunning(await fetchRobots());
      checkYinGatewayStatus();
    });
    checkYinGatewayStatus();
    setInterval(checkYinGatewayStatus, 2000);
  </script>
  <script src="/assets/auth-shell.js"></script>
</body>
</html>
