<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · OpenSwarm Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Space Grotesk", "Noto Sans SC", "PingFang SC", sans-serif; background: radial-gradient(circle at 20% 0%, #121d35 0%, #060a14 50%, #02040a 100%); color: #e9f3ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #10233f 0%, #091325 48%, #050a16 100%);
    }
    #starfield canvas {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0.96;
    }
    #starfield::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 54%, rgba(0, 0, 0, 0.42) 100%);
      pointer-events: none;
    }
    .box { position: relative; z-index: 1; }
    h1 { font-size: 1.15rem; color: #39d0ff; margin: 0 0 8px 0; }
    .sub { color: #8ea9d6; font-size: 0.84rem; margin: 0 0 16px 0; }
    input { width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(57,208,255,0.32); border-radius: 4px; color: #e9f3ff; font-size: 0.9rem; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; background: #39d0ff; color: #000; border: none; border-radius: 4px; cursor: pointer; font-size: 0.92rem; margin-top: 4px; font-weight: 700; }
    button:hover { filter: brightness(1.1); }
    .btn-google { display:block; width:100%; padding:10px 12px; margin-top:10px; border-radius:4px; border:1px solid rgba(255,255,255,0.18); background:#fff; color:#111827; text-align:center; text-decoration:none; font-size:0.9rem; font-weight:700; }
    .btn-google:hover { filter:brightness(1.03); }
    .err { color: #e08080; font-size: 0.82rem; margin-top: 8px; }
    .hint { font-size: 0.78rem; color: #8ea9d6; margin-top: 10px; line-height: 1.5; }
    .link-row { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.84rem; }
    .link-row a { color: #39d0ff; text-decoration: none; }
    .link-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="starfield" aria-hidden="true"></div>
  <div class="box" style="padding: 24px; border: 1px solid rgba(57,208,255,0.32); border-radius: 10px; background: #0b1734; min-width: 320px; box-shadow: 0 16px 36px rgba(0,0,0,0.35);">
    <h1>OpenSwarm Cloud 登录</h1>
    <p class="sub">数字员工工作台</p>
    <input type="email" id="email" placeholder="邮箱" autocomplete="username" />
    <input type="password" id="password" placeholder="密码" autocomplete="current-password" />
    <input type="text" id="tenantId" placeholder="租户ID（可选）" autocomplete="off" />
    <button type="button" id="btn">登录</button>
    <a id="googleBtn" class="btn-google" href="/api/auth/google/start">使用 Google 账号登录</a>
    <div id="err" class="err"></div>
    <div class="link-row">
      <span style="color:#8ea9d6;">没有账号？</span>
      <a href="/register.html">去注册</a>
    </div>
    <p class="hint">默认引导账号：owner@openswarm.local / OpenSwarm123!</p>
  </div>
  <script src="/assets/dot-grid-bg.js"></script>
  <script>
    if (window.initDotGridBackground) {
      window.initDotGridBackground({
        containerId: 'starfield',
        dotSize: 1.8,
        gap: 24,
        baseColor: '85,125,168',
        activeColor: '64,211,255',
        bgColor: '5,10,22',
        pulse: 0.26,
        mouseRadius: 180,
        mouseStrength: 1
      });
    }
    var emailEl = document.getElementById('email');
    var passwordEl = document.getElementById('password');
    var tenantIdEl = document.getElementById('tenantId');
    var errEl = document.getElementById('err');
    var googleBtnEl = document.getElementById('googleBtn');
    function getNextPath() {
      var sp = new URLSearchParams(location.search || '');
      var n = sp.get('next');
      if (!n) return '/index.html';
      return n;
    }
    function updateGoogleHref() {
      var next = getNextPath();
      var tenantId = tenantIdEl.value.trim();
      var url = '/api/auth/google/start?next=' + encodeURIComponent(next);
      if (tenantId) url += '&tenantId=' + encodeURIComponent(tenantId);
      googleBtnEl.href = url;
    }
    function doLogin() {
      var email = emailEl.value.trim();
      var password = passwordEl.value;
      var tenantId = tenantIdEl.value.trim();
      if (!email) { errEl.textContent = '请输入邮箱'; return; }
      if (!password) { errEl.textContent = '请输入密码'; return; }
      errEl.textContent = '';
      fetch('/api/auth/web-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, tenantId: tenantId || undefined })
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.error) { errEl.textContent = d.error; return; }
        location.href = getNextPath();
      }).catch(function() { errEl.textContent = '请求失败'; });
    }
    document.getElementById('btn').onclick = function() {
      doLogin();
    };
    tenantIdEl.addEventListener('input', updateGoogleHref);
    updateGoogleHref();
    var params = new URLSearchParams(location.search || '');
    if (params.get('error')) {
      errEl.textContent = decodeURIComponent(params.get('error'));
    }
    [emailEl, passwordEl, tenantIdEl].forEach(function(el) {
      el.onkeydown = function(e) { if (e.key === 'Enter') doLogin(); };
    });
  </script>
</body>
</html>
