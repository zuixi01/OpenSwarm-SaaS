<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目空间 · OpenSwarm</title>
  <script src="i18n.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #05070c;
      --black-light: #0d1322;
      --white: #e9f3ff;
      --white-dim: #8ea5c4;
      --gold: #39d0ff;
      --gold-dim: #16a5d4;
      --text: var(--white);
      --text-dim: var(--white-dim);
      --border: rgba(57, 208, 255, 0.32);
      --glow: rgba(57, 208, 255, 0.45);
    }
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: "Space Grotesk", "Noto Sans SC", "PingFang SC", sans-serif;
      background: radial-gradient(circle at 20% 0%, #121d35 0%, #060a14 50%, #02040a 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .app {
      width: 100%;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow: visible;
    }
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #10233f 0%, #091325 48%, #050a16 100%);
    }
    #starfield canvas {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0.96;
    }
    #starfield::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 54%, rgba(0, 0, 0, 0.42) 100%);
      pointer-events: none;
    }
    .yin-offline-banner {
      position: relative;
      width: 100%;
      margin: 10px 0 2px;
      padding: 8px 12px;
      background: rgba(168, 72, 58, 0.15);
      border: 1px solid rgba(193, 100, 82, 0.52);
      border-radius: 6px;
      font-size: 0.82rem;
      color: #e8b8a8;
      text-align: center;
      box-shadow: inset 0 0 16px rgba(105, 39, 30, 0.28);
      backdrop-filter: blur(2px);
      z-index: 2;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: rgba(110, 196, 255, 0.82);
      animation: star-breathe var(--dur, 2.5s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes star-breathe {
      0%, 100% { filter: brightness(0.7); }
      50% { filter: brightness(1.05); }
    }
    .top-strip {
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(8, 17, 31, 0.96), rgba(8, 15, 27, 0.88));
    }
    .top-bar {
      padding: 4px 0 8px;
    }
    .link-back {
      color: var(--gold-dim);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .link-back:hover { color: var(--gold); }
    .row-yinyang { display: none; }
    .taiji-wrap.control-bridge {
      width: min(860px, 94vw);
      min-height: 138px;
      height: auto;
      border-radius: 16px;
      border: 1px solid rgba(57, 208, 255, 0.45);
      background: linear-gradient(165deg, rgba(7, 22, 44, 0.94), rgba(7, 15, 33, 0.92));
      box-shadow: 0 0 28px rgba(57, 208, 255, 0.16), inset 0 0 24px rgba(6, 34, 62, 0.5);
      animation: bridge-breathe 3.2s ease-in-out infinite;
      padding: 14px 16px 12px;
      overflow: hidden;
      position: relative;
    }
    .taiji-wrap.control-bridge::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(57, 208, 255, 0.08) 1px, transparent 1px) 0 0 / 20px 20px,
        linear-gradient(0deg, rgba(57, 208, 255, 0.06) 1px, transparent 1px) 0 0 / 20px 20px;
      opacity: 0.4;
      pointer-events: none;
    }
    .taiji-wrap.control-bridge::after {
      content: "";
      position: absolute;
      inset: -30% 25%;
      background: radial-gradient(circle, rgba(57, 208, 255, 0.22), transparent 65%);
      opacity: 0.4;
      pointer-events: none;
      filter: blur(16px);
    }
    .control-bridge .bridge-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 10px;
    }
    .control-bridge .taiji-dot {
      position: relative;
      left: auto;
      top: auto;
      transform: none;
      width: 100%;
      min-width: 0;
      height: auto;
      border-radius: 12px;
      border: 1px solid rgba(57, 208, 255, 0.38);
      padding: 10px 12px;
      background: rgba(8, 20, 38, 0.9);
      box-shadow: inset 0 0 18px rgba(31, 102, 144, 0.34);
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-start;
    }
    .control-bridge .taiji-dot::after { content: none !important; }
    .control-bridge .taiji-dot[data-robot="main"] {
      background: linear-gradient(160deg, rgba(8, 31, 58, 0.96), rgba(5, 23, 42, 0.95));
    }
    .control-bridge .taiji-dot[data-robot="yang"] {
      background: linear-gradient(160deg, rgba(9, 36, 54, 0.96), rgba(6, 27, 43, 0.95));
      cursor: pointer;
    }
    .control-bridge .taiji-dot:hover {
      border-color: rgba(57, 208, 255, 0.66);
      box-shadow: 0 0 18px rgba(57, 208, 255, 0.3), inset 0 0 20px rgba(31, 102, 144, 0.45);
      /* 不使用 translateY，避免 hover 时按钮上移导致鼠标移出、反复触发造成乱跳 */
    }
    .control-bridge .taiji-dot[data-robot="main"].running,
    .control-bridge .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="main"].starting {
      border-color: rgba(109, 242, 186, 0.75);
      background: linear-gradient(160deg, rgba(7, 46, 54, 0.96), rgba(7, 30, 34, 0.95));
      box-shadow: 0 0 18px rgba(109, 242, 186, 0.38), inset 0 0 22px rgba(8, 70, 64, 0.45);
      animation: none;
    }
    .control-bridge .bridge-btn-k {
      font-family: "JetBrains Mono", monospace;
      color: #b7e9ff;
      font-size: 0.73rem;
      letter-spacing: 0.12em;
      font-weight: 700;
      line-height: 1;
    }
    .control-bridge .bridge-btn-v {
      color: #88acc9;
      font-size: 0.78rem;
      line-height: 1.15;
      letter-spacing: 0.04em;
    }
    .control-bridge .bridge-foot {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .control-bridge .bridge-chip {
      border: 1px solid rgba(57, 208, 255, 0.3);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      color: #95cbeb;
      background: rgba(6, 19, 35, 0.65);
      font-family: "JetBrains Mono", monospace;
    }
    @keyframes bridge-breathe {
      0%, 100% { box-shadow: 0 0 28px rgba(57, 208, 255, 0.2), inset 0 0 16px rgba(9, 30, 58, 0.7); }
      50% { box-shadow: 0 0 42px rgba(57, 208, 255, 0.35), inset 0 0 28px rgba(10, 42, 74, 0.92); }
    }
    .taiji-wrap {
      position: relative;
      width: 200px;
      height: 200px;
    }
    .taiji-wrap svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* 主控策略鱼：纯黑 #000000 / 纯白 #FFFFFF，鱼眼反色；外发光 + 呼吸光效 */
    .taiji-wrap {
      filter: drop-shadow(0 0 24px rgba(255,255,255,0.25));
      animation: taiji-glow-breathe 4s ease-in-out infinite;
    }
    @keyframes taiji-glow-breathe {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)) drop-shadow(0 0 50px rgba(255,255,255,0.12)); }
      50% { filter: drop-shadow(0 0 32px rgba(255,255,255,0.35)) drop-shadow(0 0 70px rgba(255,255,255,0.2)); }
    }
    .taiji-wrap svg .half { stroke: none; }
    .taiji-wrap svg .half-white { fill: #FFFFFF; }
    .taiji-wrap svg .half-black { fill: #000000; }
    .taiji-wrap svg .stroke { fill: none; stroke: rgba(255,255,255,0.5); stroke-width: 1; }
    .taiji-wrap svg .eye-white { fill: #FFFFFF; }
    .taiji-wrap svg .eye-black { fill: #000000; }
    /* 两枚圆点按钮（仅圆形 taiji 布局，非 control-bridge 面板） */
    .taiji-wrap:not(.control-bridge) .taiji-dot {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: box-shadow 0.2s, background 0.2s;
    }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="main"] { left: 50%; top: 32%; transform: translate(-50%, -50%); background: rgba(120,120,120,0.3); }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="yang"] { left: 50%; top: 68%; transform: translate(-50%, -50%); background: #0a0a0e; cursor: default; animation: breathe-dot-black 2s ease-in-out infinite; }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="main"]:hover { background: rgba(140,140,140,0.45); }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="yang"]:hover { background: #0a0a0e; }
    .taiji-wrap:not(.control-bridge) .taiji-dot.running { }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="main"].running {
      background: #f0ece8;
      animation: breathe-dot-white 2s ease-in-out infinite;
    }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="yang"].running {
      background: #0a0a0e;
      animation: breathe-dot-black 2s ease-in-out infinite;
    }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="main"].starting {
      background: #f0ece8;
      animation: breathe-dot-white 1.5s ease-in-out infinite;
    }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="yang"].starting {
      background: #0a0a0e;
      animation: breathe-dot-black 1.5s ease-in-out infinite;
    }
    @keyframes breathe-dot-black {
      0%, 100% { box-shadow: 0 0 8px rgba(0,0,0,0.8), 0 0 16px rgba(40,40,55,0.5); }
      50% { box-shadow: 0 0 18px rgba(0,0,0,0.95), 0 0 28px rgba(50,50,70,0.6); }
    }
    @keyframes breathe-dot-white {
      0%, 100% { box-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 16px rgba(255,255,255,0.3); }
      50% { box-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 32px rgba(255,255,255,0.5); }
    }
    .taiji-buttons-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .taiji-buttons-layer > * { pointer-events: auto; }
    .taiji-wrap:not(.control-bridge) .taiji-dot {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      padding: 0;
      background: rgba(120,120,120,0.3);
      transition: box-shadow 0.2s, background 0.2s;
    }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="main"] { left: 50%; top: 32%; transform: translate(-50%, -50%); }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="yang"] { left: 50%; top: 68%; transform: translate(-50%, -50%); background: #0a0a0e; cursor: default; }
    .taiji-wrap:not(.control-bridge) .taiji-dot:hover { background: rgba(140,140,140,0.45); }
    .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="main"].running {
      background: #f0ece8;
      animation: breathe-dot-white 2s ease-in-out infinite;
    }
    .taiji-wrap:not(.control-bridge) .taiji-wrap:not(.control-bridge) .taiji-dot[data-robot="yang"].running {
      background: #0a0a0e;
      animation: breathe-dot-black 2s ease-in-out infinite;
    }
    @keyframes breathe-dot-black {
      0%, 100% { box-shadow: 0 0 8px rgba(0,0,0,0.8); }
      50% { box-shadow: 0 0 18px rgba(0,0,0,0.95); }
    }
    @keyframes breathe-dot-white {
      0%, 100% { box-shadow: 0 0 8px rgba(255,255,255,0.6); }
      50% { box-shadow: 0 0 20px rgba(255,255,255,0.9); }
    }
    .yinyang-stop {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);
      margin-top: 8px;
      display: flex;
      gap: 8px;
      z-index: 1;
      pointer-events: auto;
    }
    .btn-yinyang-stop {
      padding: 4px 10px;
      font-size: 0.7rem;
      color: #dc5050;
      background: transparent;
      border: 1px solid rgba(220,80,80,0.5);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-yinyang-stop:hover { filter: brightness(1.2); }
    .page-wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      max-height: none;
      display: block;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 20px 24px;
    }
    .page-left {
      width: 100%;
      min-width: 0;
      max-width: none;
      display: flex;
      flex-direction: column;
      background: transparent;
    }
    .resizer-v {
      display: none;
      width: 6px;
      flex-shrink: 0;
      cursor: col-resize;
      background: transparent;
    }
    .resizer-v:hover { background: rgba(57, 208, 255, 0.15); }
    .page-right {
      flex: 1;
      min-width: 0;
      min-height: 0;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--black-light);
      border-left: 1px solid var(--border);
      overflow: hidden;
    }
    .section-yin-chat {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .yin-chat-hint { font-size: 0.75rem; color: var(--text-dim); margin: 0 0 8px 0; }
    .section-yin-chat h2 {
      font-size: 0.95rem;
      color: var(--gold-dim);
      font-weight: 500;
      letter-spacing: 0.08em;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .yin-chat-clear-btn {
      font-size: 0.78rem;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .yin-chat-clear-btn:hover { color: #e05555; border-color: #e05555; }
    .yin-chat-messages {
      flex: 1;
      min-height: 120px;
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(57, 208, 255, 0.5) var(--black-light);
    }
    .yin-chat-messages::-webkit-scrollbar { width: 8px; }
    .yin-chat-messages::-webkit-scrollbar-track { background: var(--black-light); border-radius: 4px; }
    .yin-chat-messages::-webkit-scrollbar-thumb { background: rgba(57, 208, 255, 0.45); border-radius: 4px; }
    .yin-chat-messages::-webkit-scrollbar-thumb:hover { background: rgba(57, 208, 255, 0.65); }
    .yin-chat-msg {
      margin: 8px 0;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .yin-chat-msg.user { color: var(--white-dim); }
    .yin-chat-msg.user .who { color: var(--gold-dim); }
    .yin-chat-msg.yin .who { color: var(--gold); }
    .yin-chat-msg .who { margin-right: 6px; font-weight: 500; }
    .yin-chat-msg.yin-thinking { color: var(--text-dim); opacity: 0.9; }
    .yin-chat-msg.yin-thinking .yin-thinking-text { animation: yin-thinking-pulse 1.5s ease-in-out infinite; }
    @keyframes yin-thinking-pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    .yin-chat-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      flex-shrink: 0;
    }
    .yin-chat-input-row input {
      flex: 1;
      padding: 10px 14px;
      background: radial-gradient(circle at 20% 0%, #121d35 0%, #060a14 50%, #02040a 100%);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .yin-chat-input-row input::placeholder { color: var(--text-dim); }
    .yin-chat-send {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      color: var(--gold);
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .yin-chat-send:hover { background: rgba(57, 208, 255, 0.12); }
    .yin-chat-send:disabled { opacity: 0.6; cursor: not-allowed; }
    .module-projects {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: visible;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .section-create {
      margin-bottom: 18px;
      padding: 16px 18px;
      background: linear-gradient(180deg, rgba(10, 22, 40, 0.96), rgba(8, 17, 31, 0.94));
      border: 1px solid rgba(57, 208, 255, 0.26);
      border-radius: 16px;
      box-shadow: 0 0 18px rgba(57, 208, 255, 0.08), inset 0 0 18px rgba(12, 42, 72, 0.12);
    }
    .section-create h2 {
      margin: 0 0 12px 0;
      font-size: 0.85rem;
      color: var(--gold-dim);
      font-weight: 500;
      letter-spacing: 0.1em;
    }
    .create-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .create-row input {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      background: radial-gradient(circle at 20% 0%, #121d35 0%, #060a14 50%, #02040a 100%);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .create-row input::placeholder { color: var(--text-dim); }
    .create-row input:focus {
      outline: none;
      border-color: var(--gold-dim);
      box-shadow: 0 0 8px var(--glow);
    }
    .btn-create {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      color: var(--gold);
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-create:hover {
      background: rgba(57, 208, 255, 0.12);
      box-shadow: 0 0 12px var(--glow);
    }
    .section-list h2 {
      margin: 0 0 14px 0;
      font-size: 0.9rem;
      color: var(--gold-dim);
      font-weight: 600;
      letter-spacing: 0.12em;
    }
    .project-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .project-list li { margin: 0; }
    .project-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      padding: 16px;
      background:
        linear-gradient(180deg, rgba(9, 21, 41, 0.96), rgba(8, 17, 32, 0.94)),
        radial-gradient(circle at top right, rgba(57, 208, 255, 0.12), transparent 42%);
      border: 1px solid rgba(57, 208, 255, 0.28);
      border-radius: 14px;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      overflow: hidden;
    }
    .project-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(57, 208, 255, 0.06) 1px, transparent 1px) 0 0 / 20px 20px,
        linear-gradient(0deg, rgba(57, 208, 255, 0.05) 1px, transparent 1px) 0 0 / 20px 20px;
      opacity: 0.36;
      pointer-events: none;
    }
    .project-card:hover {
      transform: translateY(-1px);
      border-color: rgba(57, 208, 255, 0.58);
      box-shadow: 0 0 18px rgba(57, 208, 255, 0.18), inset 0 0 18px rgba(18, 70, 102, 0.16);
    }
    .project-card .card-link {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
      min-width: 0;
      text-decoration: none;
      color: inherit;
    }
    .project-card .card-link:hover { color: var(--gold); }
    .project-card .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .project-card .card-badge {
      flex-shrink: 0;
      min-width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid rgba(57, 208, 255, 0.34);

</head>
<body data-i18n-title="projectsTitle">
  <div id="starfield" aria-hidden="true"></div>
  <div class="app">
    <div class="top-strip">
      <div class="top-bar" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <a href="index.html" class="link-back" data-i18n="backHome">← 面板首页</a>
          <a href="yang.html" class="link-back">策略编排</a>
          <a href="billing.html" class="link-back">计费中心</a>
          <a href="runtime-admin.html" class="link-back">Runtime管理</a>
        </div>
        <span id="openswarm-lang-toggle-wrap"></span>
      </div>
    </div>
    <div class="page-wrap">
      <div class="page-left">
        <div class="module-projects">
          <section class="section-create">
            <h2 data-i18n="createProject">新建团队</h2>
            <div class="create-row">
              <input type="text" id="newProjectName" data-i18n-placeholder="inputProjectName" placeholder="输入项目名称" maxlength="64" />
              <button type="button" class="btn-create" id="btnCreate" data-i18n="btnCreate">新建</button>
            </div>
            <div class="create-row" style="margin-top:8px;">
              <select id="projectTemplateSelect" style="flex:1;padding:8px 12px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:0.85rem;">
                <option value="">从模板创建（可选）</option>
              </select>
            </div>
          </section>
          <section class="section-list">
            <h2 data-i18n="projectList">团队列表</h2>
            <ul class="project-list" id="projectList"></ul>
            <p class="empty-hint" id="emptyHint" style="display:none;" data-i18n="emptyHint">暂无项目，上方创建后即可在项目内选员工、与主控对话。</p>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    var t = window.OPENSWARM_I18N && window.OPENSWARM_I18N.t ? window.OPENSWARM_I18N.t.bind(window.OPENSWARM_I18N) : function(k) { return (arguments.length > 1 ? k.replace('{0}', arguments[1]) : k); };
    if (window.initDotGridBackground) {
      window.initDotGridBackground({
        containerId: 'starfield',
        dotSize: 1.8,
        gap: 24,
        baseColor: '85,125,168',
        activeColor: '64,211,255',
        bgColor: '5,10,22',
        pulse: 0.26,
        mouseRadius: 180,
        mouseStrength: 1
      });
    }

    var toast = document.getElementById('toast');
    var listEl = document.getElementById('projectList');
    var emptyHint = document.getElementById('emptyHint');
    var newNameInput = document.getElementById('newProjectName');
    var btnCreate = document.getElementById('btnCreate');
    var projectTemplateSelect = document.getElementById('projectTemplateSelect');
    var rowYinyang = document.getElementById('rowYinyang');
    var yinChatMessages = document.getElementById('yinChatMessages');
    var yinChatInput = document.getElementById('yinChatInput');
    var yinChatSend = document.getElementById('yinChatSend');
    var resizerV = document.getElementById('resizerV');
    var CHAT_STORAGE_KEY = 'yin_chat_history_projects';
    var YIN_SERVER_PROJECT_ID = 'global'; // 列表页主控对话用固定的 global 项目ID持久化

    async function fetchRobots() {
      try {
        const r = await fetch('/api/robots');
        if (r.ok) return await r.json();
      } catch (_) {}
      return [
        { id: 'main', name: '主控', gateway: 'ws://127.0.0.1:18789', running: false },
      ];
    }

    function updateYinyangState(robots) {
      if (!rowYinyang) return;
      const byId = {};
      (robots || []).forEach(function(r) { byId[r.id] = r; });
      rowYinyang.querySelectorAll('.taiji-dot').forEach(function(btn) {
        const rid = btn.dataset.robot;
        if (rid === 'yang') {
          btn.title = t('yangDisplayOnly');
          btn.classList.remove('running', 'starting');
          return;
        }
        const r = byId[rid];
        const isRunning = !!r && !!r.running;
        btn.classList.toggle('running', isRunning);
        if (isRunning) {
          btn.classList.remove('starting');
          btn.title = rid === 'main' ? t('yinClickMainStop') : t('yangClickStop');
        } else {
          btn.title = rid === 'main' ? t('yinClickMainStart') : t('yangClickStart');
        }
      });
    }

    // 绑定主控策略按钮：点击切换启动/停止
    if (rowYinyang) {
      rowYinyang.querySelectorAll('.taiji-dot').forEach(function(btn) {
        const robotId = btn.dataset.robot;
        btn.addEventListener('click', async function() {
          if (robotId === 'yang') {
            location.href = 'yang.html';
            return;
          }
          const robots = await fetchRobots();
          const robot = robots.find(function(r) { return r.id === robotId; });
          const isRunning = !!(robot && robot.running);
          if (isRunning) {
            // 运行中：点击停止
            btn.disabled = true;
            try {
              const r = await fetch('/api/stop/' + robotId, { method: 'POST' });
              const data = await r.json().catch(function() { return {}; });
              if (r.ok && !data.error) {
                show(t('toastStopped'));
                const next = await fetchRobots();
                updateYinyangState(next);
              } else {
                show(data.error || t('toastStopFailed'));
              }
            } catch (e) {
              show(t('toastRequestFailedShort') + ': ' + (e.message || ''));
            }
            btn.disabled = false;
          } else {
            // 未运行：点击启动
            btn.classList.add('starting');
            try {
              const r = await fetch('/api/open-tui/' + robotId, { method: 'POST' });
              const data = await r.json().catch(function() { return {}; });
              if (r.ok && !data.error) {
                show(data.reused ? t('toastTerminalReused') : t('toastTerminalOpened'));
              } else {
                show(data.error || t('toastStartFailed') + ' (HTTP ' + r.status + ')');
                btn.classList.remove('starting');
              }
            } catch (e) {
              show(t('toastRequestFailedShort') + ': ' + (e.message || ''));
              btn.classList.remove('starting');
            }
          }
        });
      });
    }
    fetch('/api/robots').then(function(r) { return r.json(); }).then(updateYinyangState).catch(function() {});
    // 定期刷新主控策略状态
    setInterval(async function() {
      const robots = await fetchRobots();
      updateYinyangState(robots);
    }, 1000);

    function show(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 3000);
    }

    function renderList(projects) {
      window.__lastProjects = projects || [];
      listEl.innerHTML = '';
      if (!projects || projects.length === 0) {
        emptyHint.style.display = 'block';
        return;
      }
      emptyHint.style.display = 'none';
      projects.forEach(function(p) {
        var li = document.createElement('li');
        var card = document.createElement('div');
        card.className = 'project-card';
        // 名字区域（可点击内联编辑）
        var cardLeft = document.createElement('div');
        cardLeft.className = 'card-link';
        cardLeft.style.cursor = 'default';
        var isHexDefinition = p.noDelete || p.id === 'hex-definition';
        var memberCount = p.hexIds && p.hexIds.length ? p.hexIds.length : 0;
        var badgeText = isHexDefinition ? 'SYS' : ('T' + String(memberCount || 0));
        var cardHead = document.createElement('div');
        cardHead.className = 'card-head';
        var badge = document.createElement('div');
        badge.className = 'card-badge';
        badge.textContent = badgeText;
        var titleBlock = document.createElement('div');
        titleBlock.className = 'card-title-block';
        var nameSpan = document.createElement('span');
        nameSpan.className = 'name';
        nameSpan.textContent = (p.id === 'hex-definition') ? t('hexDefinitionName') : p.name;
        if (!isHexDefinition) nameSpan.title = t('clickEditName');
        var metaSpan = document.createElement('span');
        metaSpan.className = 'meta';
        metaSpan.innerHTML = '<span class="meta-chip">' + escapeHtml(memberCount ? t('hexCount', memberCount) : t('hexNotSelected')) + '</span>'
          + '<span class="meta-chip">ID · ' + escapeHtml(p.id) + '</span>';
        var entryHint = document.createElement('div');
        entryHint.className = 'card-entry';
        entryHint.innerHTML = '<strong>ENTER</strong><span>' + escapeHtml(isHexDefinition ? '系统岗位映射定义' : '进入团队空间，开始协作与编排') + '</span>';
        // 点击名字跳转；非「员工自定义」时可点击编辑名称
        if (!isHexDefinition) {
          nameSpan.addEventListener('click', function(e) {
            e.stopPropagation();
            var input = document.createElement('input');
            input.type = 'text';
            input.className = 'name-input';
            input.value = p.name;
            nameSpan.replaceWith(input);
            input.focus();
            input.select();
            function saveRename() {
              var newName = input.value.trim();
              if (!newName || newName === p.name) {
                input.replaceWith(nameSpan);
                return;
              }
              fetch('/api/projects/' + encodeURIComponent(p.id), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName })
              })
                .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                .then(function(result) {
                  if (result.ok) {
                    p.name = result.data.name;
                    nameSpan.textContent = result.data.name;
                    show(t('toastRenamed', result.data.name));
                  } else {
                    show(result.data.error || t('toastRenameFailed'));
                  }
                  input.replaceWith(nameSpan);
                })
                .catch(function() { show(t('toastRequestFailedShort')); input.replaceWith(nameSpan); });
            }
            input.addEventListener('blur', saveRename);
            input.addEventListener('keydown', function(e) {
              if (e.key === 'Enter') { input.blur(); }
              if (e.key === 'Escape') { input.value = p.name; input.blur(); }
            });
          });
        }
        cardLeft.addEventListener('click', function(e) {
          if (e.target === nameSpan || e.target.classList.contains('name-input')) return;
          window.location.href = 'project.html?id=' + encodeURIComponent(p.id);
        });
        titleBlock.appendChild(nameSpan);
        titleBlock.appendChild(metaSpan);
        cardHead.appendChild(badge);
        cardHead.appendChild(titleBlock);
        cardLeft.appendChild(cardHead);
        cardLeft.appendChild(entryHint);
        card.appendChild(cardLeft);

        var actions = document.createElement('div');
        actions.className = 'card-actions';
        var btnOpen = document.createElement('button');
        btnOpen.type = 'button';
        btnOpen.className = 'btn-card-action btn-open';
        btnOpen.textContent = '进入';
        btnOpen.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = 'project.html?id=' + encodeURIComponent(p.id);
        });
        actions.appendChild(btnOpen);
        if (!isHexDefinition) {
          var btnDelete = document.createElement('button');
          btnDelete.type = 'button';
          btnDelete.className = 'btn-card-action btn-delete';
          btnDelete.textContent = t('btnDelete');
          actions.appendChild(btnDelete);
          btnDelete.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (!confirm(t('confirmDeleteProject', p.name))) return;
            fetch('/api/projects/' + encodeURIComponent(p.id), { method: 'DELETE' })
              .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
              .then(function(result) {
                if (result.ok) {
                  show(t('toastDeleted'));
                  loadProjects();
                } else {
                  show(result.data.error || t('toastDeleteFailed'));
                }
              })
              .catch(function() { show(t('toastRequestFailedShort')); });
          });
        }
        card.appendChild(actions);
        li.appendChild(card);
        listEl.appendChild(li);
      });
    }

    function escapeHtml(s) {
      var div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function loadProjects() {
      return fetch('/api/projects')
        .then(function(r) { return r.json(); })
        .then(function(projects) {
          renderList(projects);
          return projects;
        })
        .catch(function() { 
          show(t('toastLoadProjectsFailed'));
          return [];
        });
    }

    function loadProjectTemplates() {
      fetch('/api/project-templates').then(function(r) { return r.json(); })
        .then(function(d) {
          var sel = projectTemplateSelect;
          if (!sel) return;
          sel.innerHTML = '<option value="">从模板创建（可选）</option>';
          (d.templates || []).forEach(function(t) {
            var opt = document.createElement('option');
            opt.value = t.id;
            opt.textContent = t.name + (t.description ? ' - ' + t.description : '');
            sel.appendChild(opt);
          });
        })
        .catch(function() {});
    }
    loadProjectTemplates();

    btnCreate.addEventListener('click', function() {
      var name = (newNameInput.value || '').trim();
      if (!name) {
        show(t('toastEnterProjectName'));
        return;
      }
      var templateId = projectTemplateSelect ? projectTemplateSelect.value : '';
      btnCreate.disabled = true;
      fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, templateId: templateId || undefined })
      })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(result) {
          if (result.ok) {
            newNameInput.value = '';
            show(t('toastCreated', result.data.name));
            // 刷新列表，然后跳转到项目页面
            loadProjects().then(function() {
              setTimeout(function() {
                window.location.href = 'project.html?id=' + encodeURIComponent(result.data.id);
              }, 200);
            });
          } else {
            show(result.data.error || t('toastCreateFailed'));
          }
        })
        .catch(function() { show(t('toastRequestFailedShort')); })
        .then(function() { btnCreate.disabled = false; });
    });
    newNameInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') btnCreate.click();
    });

    // 右侧与主控对话（列表页，使用 global 固定 projectId 持久化到服务端）
    var _yinChatCache = []; // 内存缓存，避免频繁序列化 DOM
    function saveYinChatHistory() {
      fetch('/api/chat-history/' + YIN_SERVER_PROJECT_ID + '/yin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: _yinChatCache })
      }).catch(function() {});
      try { localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(_yinChatCache)); } catch (e) {}
    }
    function loadYinChatHistory() {
      if (!yinChatMessages) return;
      fetch('/api/chat-history/' + YIN_SERVER_PROJECT_ID + '/yin')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var msgs = (data && Array.isArray(data.messages)) ? data.messages : [];
          if (msgs.length > 0) {
            _yinChatCache = msgs;
            msgs.forEach(function(msg) { appendYinChatMsg(msg.role, msg.text, false); });
          } else {
            // 降级到 localStorage
            try {
              var stored = localStorage.getItem(CHAT_STORAGE_KEY);
              if (stored) {
                var lsMsgs = JSON.parse(stored);
                _yinChatCache = lsMsgs;
                lsMsgs.forEach(function(msg) { appendYinChatMsg(msg.role, msg.text, false); });
              }
            } catch (e) {}
          }
        })
        .catch(function() {
          try {
            var stored = localStorage.getItem(CHAT_STORAGE_KEY);
            if (stored) {
              var lsMsgs = JSON.parse(stored);
              _yinChatCache = lsMsgs;
              lsMsgs.forEach(function(msg) { appendYinChatMsg(msg.role, msg.text, false); });
            }
          } catch (e) {}
        });
    }
    function getYinHistoryForAPI() {
      return _yinChatCache.slice(-15);
    }
    function appendYinChatMsg(role, text, save) {
      if (save === undefined) save = true;
      if (!yinChatMessages) return;
      var div = document.createElement('div');
      div.className = 'yin-chat-msg ' + role;
      var who = role === 'user' ? t('me') : t('yinLabel');
      var textHtml = role === 'user' ? escapeHtml(text) : ('<span class="yin-chat-md">' + (typeof marked !== 'undefined' ? marked.parse(String(text || ''), { breaks: true, gfm: true }) : escapeHtml(text)) + '</span>');
      div.innerHTML = '<span class="who">' + escapeHtml(who) + '</span>' + textHtml;
      yinChatMessages.appendChild(div);
      yinChatMessages.scrollTop = yinChatMessages.scrollHeight;
      if (save) {
        _yinChatCache.push({ role: role, text: text });
        saveYinChatHistory();
      }
    }
    if (yinChatSend && yinChatInput) {
      var YIN_TASK_KEY_GLOBAL = 'yinChatTask_global';
      var _yinPollTimer = null;
      function removeYinThinkingMsg() {
        var el = yinChatMessages && yinChatMessages.querySelector('.yin-chat-msg.yin-thinking');
        if (el) el.remove();
      }
      function appendYinThinkingMsg() {
        removeYinThinkingMsg();
        if (!yinChatMessages) return;
        var div = document.createElement('div');
        div.className = 'yin-chat-msg yin yin-thinking';
        div.innerHTML = '<span class="who">' + escapeHtml(t('yinLabel')) + '</span><span class="yin-thinking-text">' + t('yinThinking') + '</span>';
        yinChatMessages.appendChild(div);
        yinChatMessages.scrollTop = yinChatMessages.scrollHeight;
      }
      function pollYinTask(taskId) {
        fetch('/api/yin/task/' + encodeURIComponent(taskId))
          .then(function(r) { return r.json(); })
          .then(function(task) {
            if (task.status === 'done') {
              try { sessionStorage.removeItem(YIN_TASK_KEY_GLOBAL); } catch (e) {}
              removeYinThinkingMsg();
              if (task.reply) appendYinChatMsg('yin', task.reply);
              yinChatSend.disabled = false;
              saveYinChatHistory();
              return;
            }
            if (task.status === 'error') {
              try { sessionStorage.removeItem(YIN_TASK_KEY_GLOBAL); } catch (e) {}
              removeYinThinkingMsg();
              appendYinChatMsg('yin', task.error ? t('yinNoReplyWith', task.error) : '（' + t('yinNoReply') + '）');
              yinChatSend.disabled = false;
              return;
            }
            _yinPollTimer = setTimeout(function() { pollYinTask(taskId); }, 1500);
          })
          .catch(function() {
            _yinPollTimer = setTimeout(function() { pollYinTask(taskId); }, 2000);
          });
      }
      yinChatSend.addEventListener('click', function() {
        var text = (yinChatInput.value || '').trim();
        if (!text) return;
        yinChatInput.value = '';
        appendYinChatMsg('user', text);
        yinChatSend.disabled = true;
        fetch('/api/yin/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, projectId: YIN_SERVER_PROJECT_ID, history: getYinHistoryForAPI() })
        })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var taskId = data && data.taskId;
            if (!taskId) {
              appendYinChatMsg('yin', t('yinNoReplyWith', (data && data.error ? data.error : '未返回 taskId')));
              yinChatSend.disabled = false;
              return;
            }
            try { sessionStorage.setItem(YIN_TASK_KEY_GLOBAL, taskId); } catch (e) {}
            appendYinThinkingMsg();
            pollYinTask(taskId);
          })
          .catch(function() {
            appendYinChatMsg('yin', '（' + t('toastRequestFailedShort') + '）');
            yinChatSend.disabled = false;
          });
      });
      window.addEventListener('beforeunload', function() {
        if (_yinPollTimer) clearTimeout(_yinPollTimer);
      });
      (function() {
        try {
          var savedTaskId = sessionStorage.getItem(YIN_TASK_KEY_GLOBAL);
          if (!savedTaskId) return;
          yinChatSend.disabled = true;
          appendYinThinkingMsg();
          pollYinTask(savedTaskId);
        } catch (e) {}
      })();
      yinChatInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') yinChatSend.click();
      });
    }
    loadYinChatHistory();

    var yinChatClearBtn = document.getElementById('yinChatClearBtn');
    if (yinChatClearBtn) {
      yinChatClearBtn.addEventListener('click', function() {
        if (!confirm(t('confirmClearYinChat'))) return;
        if (yinChatMessages) yinChatMessages.innerHTML = '';
        _yinChatCache = [];
        try { localStorage.removeItem(CHAT_STORAGE_KEY); } catch (e) {}
        fetch('/api/chat-history/' + YIN_SERVER_PROJECT_ID + '/yin', { method: 'DELETE' }).catch(function() {});
      });
    }

    // 拖动调整左侧宽度
    if (resizerV) {
      var startX = 0, startW = 0;
      function onResizeStart(e) {
        e.preventDefault();
        startX = e.clientX;
        startW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--left-width') || '360', 10);
        document.addEventListener('mousemove', onResizeMove);
        document.addEventListener('mouseup', onResizeEnd);
      }
      function onResizeMove(e) {
        var dx = e.clientX - startX;
        var w = Math.max(280, Math.min(560, startW + dx));
        document.documentElement.style.setProperty('--left-width', w + 'px');
      }
      function onResizeEnd() {
        document.removeEventListener('mousemove', onResizeMove);
        document.removeEventListener('mouseup', onResizeEnd);
      }
      resizerV.addEventListener('mousedown', onResizeStart);
    }

    loadProjects();

    window.OPENSWARM_APPLY_I18N_EXTRAS = function() {
      if (rowYinyang) {
        fetchRobots().then(updateYinyangState);
      }
      var msgs = document.querySelectorAll('.yin-chat-msg');
      msgs.forEach(function(m) {
        var who = m.querySelector('.who');
        if (who) who.textContent = m.classList.contains('user') ? t('me') : t('yinLabel');
      });
      renderList(window.__lastProjects || []);
    };
  </script>
  <script src="/assets/auth-shell.js"></script>
</body>
</html>
